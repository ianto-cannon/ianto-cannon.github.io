<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blob clocks</title>
  <meta property="og:title" content="Blob clocks">
  <meta name="description" content="The following blobs have waves that pass once per year, day, hour, minute, and second, respectively.">
  <meta name="keywords" content="SVG, JavaScript, clock graphics, interactive clocks">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta property="og:description" content="The following blobs have waves that pass once per year, day, hour, minute, and second, respectively.">
  <meta property="og:image" content="poly.jpg">
  <meta property="og:image:alt" content="Screenshot of polygon clock">
  <link rel="stylesheet" href="dark.css" media="not (prefers-color-scheme: light)" data-theme="dark">
  <link rel="stylesheet" href="common.css"/>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="icon" href="/favicon.png"  type="image/png" sizes="192x192" />
  <link rel="icon" href="/favicon512.png"  type="image/png" sizes="512x512" />
  <link rel="manifest" href="/clock.webmanifest">
  <link rel="canonical" href="https://ianto-cannon.github.io/clockBlobs.html">
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
    } svg {
      width: 16%;
    }
  </style>
</head>
<body>
  <svg class="blob"><path data-min="1" data-max="1" /></svg>
  <svg class="blob"><path data-min="2" data-max="2" /></svg>
  <svg class="blob"><path data-min="3" data-max="3" /></svg>
  <svg class="blob"><path data-min="4" data-max="4" /></svg>
  <svg class="blob"><path data-min="5" data-max="5" /></svg>
  <svg class="blob"><path data-min="6" data-max="6" /></svg>
  <script defer src="common.js"></script>
  <script defer src="clock.js"></script>
</body>
</html>
