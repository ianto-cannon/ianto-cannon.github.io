<!-- clockPoly.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Polygon clocks</title>
  <meta property="og:title" content="Polygon clocks">
  <meta name="description" content="These polygons show the time in the format yy:M:w:d:h:mm:ss.">
  <meta name="keywords" content="SVG, JavaScript, clock graphics, interactive clocks">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta property="og:description" content="These polygons show the time in the format yy:M:w:d:h:mm:ss.">
  <meta property="og:image" content="poly.jpg">
  <meta property="og:image:alt" content="Screenshot of polygon clock">
  <link rel="stylesheet" href="dark.css" media="not (prefers-color-scheme: light)" data-theme="dark">
  <link rel="stylesheet" href="common.css"/>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="icon" href="/favicon.png"  type="image/png" sizes="192x192" />
  <link rel="icon" href="/favicon512.png"  type="image/png" sizes="512x512" />
  <link rel="manifest" href="/clock.webmanifest">
  <link rel="canonical" href="https://ianto-cannon.github.io/clockPoly.html">
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
    } .poly-container {
      width: 100%;
      font-size: 1vw;
    } .poly {
      width: 7.9em;
      aspect-ratio: 1;
    } .raised {
      position: relative;
      top: -.75em;
      font-size: 4em;
    }
  </style>
</head>
<body>
  <div class="poly-container">
    <svg class="poly"><path data-level="0"/></svg>
    <svg class="poly"><path data-level="1"/></svg><span class="raised">:</span>
    <svg class="poly"><path data-level="2"/></svg><span class="raised">:</span>
    <svg class="poly"><path data-level="3"/></svg><span class="raised">:</span>
    <svg class="poly"><path data-level="4"/></svg><span class="raised">:</span>
    <svg class="poly"><path data-level="5"/></svg><span class="raised">:</span>
    <svg class="poly"><path data-level="6"/></svg>
    <svg class="poly"><path data-level="7"/></svg><span class="raised">:</span>
    <svg class="poly"><path data-level="8"/></svg>
    <svg class="poly"><path data-level="9"/></svg>
  </div>
  <script defer src="common.js"></script>
  <script defer src="clock.js"></script>
</body>
</html>
